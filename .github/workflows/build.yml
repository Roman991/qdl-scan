name: build

on:
  push:
    branches: [ main ]
  pull_request:

env:
  PUBLISH_DIR: QdlScan/bin/Release/net48/publish

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore QdlScan.sln

      - name: Build
        run: dotnet build QdlScan.sln -c Release --no-restore -p:BuildNumber=${{ github.run_number }}

      - name: Test
        run: dotnet test QdlScan.sln -c Release --no-build

      - name: Publish (.NET Framework 4.8, framework-dependent)
        run: dotnet publish QdlScan/QdlScan.csproj -c Release -p:BuildNumber=${{ github.run_number }}

      - name: Upload publish output
        uses: actions/upload-artifact@v4
        with:
          name: publish-win-x64
          path: ${{ env.PUBLISH_DIR }}/

  release:
    needs: build
    # Solo sui push a main (mai sulle PR), e solo se build+test sono passati.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Download publish output
        uses: actions/download-artifact@v4
        with:
          name: publish-win-x64
          # Ripristina nella stessa cartella che setup.iss si aspetta (PublishDir).
          path: ${{ env.PUBLISH_DIR }}

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          [xml]$proj = Get-Content QdlScan/QdlScan.csproj
          $v = ($proj.Project.PropertyGroup.Version | Where-Object { $_ } | Select-Object -First 1)
          if (-not $v) { $v = '0.0.0' }
          "version=$v" >> $env:GITHUB_OUTPUT
          # Tag unico ad ogni push grazie al numero di run.
          "tag=v$v-build.${{ github.run_number }}" >> $env:GITHUB_OUTPUT

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build installer (QdlScanSetup.exe)
        shell: pwsh
        working-directory: installer
        run: |
          & "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe" setup.iss

      - name: Package portable zip
        shell: pwsh
        run: Compress-Archive -Path "${{ env.PUBLISH_DIR }}/*" -DestinationPath "QdlScan-portable-win-x64.zip" -Force

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: Qdl Scan ${{ steps.ver.outputs.version }} (build ${{ github.run_number }})
          body: |
            Build automatica da `${{ github.sha }}`.

            - `QdlScanSetup.exe` — installer (framework-dependent).
            - `QdlScan-portable-win-x64.zip` — versione portable (scompatta ed esegui `QdlScan.exe`).

            **Prerequisito** (già presente su quasi tutti i PC Windows 10/11):
            - .NET Framework 4.8 — se mancante, [scaricalo qui](https://dotnet.microsoft.com/download/dotnet-framework/net48)
          files: |
            installer/Output/QdlScanSetup.exe
            QdlScan-portable-win-x64.zip
          fail_on_unmatched_files: true
